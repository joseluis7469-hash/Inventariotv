<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Buscador de TV</title>
  
  <!-- CSS de la aplicación para mantener el estilo -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <!-- Tom Select CSS (Estilo Bootstrap/Default) -->
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.default.css" rel="stylesheet">
  
  <style>
    body {
      padding: 3rem;
      background: var(--bg-body, #0f172a);
      color: var(--text-primary, #f8fafc);
    }
    .demo-container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--bg-surface, #1e293b);
      padding: 2rem;
      border-radius: 8px;
      border: 1px solid var(--border, #334155);
    }
    
    /* Adaptar Tom Select al estilo oscuro del hotel */
    .ts-control {
      background: var(--bg-body, #0f172a);
      border: 1px solid var(--border, #334155);
      color: var(--text-primary, #f8fafc);
      border-radius: 4px;
      padding: 0.6rem 0.8rem;
    }
    .ts-control > input {
      color: var(--text-primary, #f8fafc) !important;
    }
    .ts-dropdown {
      background: var(--bg-surface, #1e293b);
      border: 1px solid var(--border, #334155);
      color: var(--text-primary, #f8fafc);
    }
    .ts-dropdown .active {
      background: var(--primary, #3b82f6) !important;
      color: white !important;
    }
    .ts-dropdown .option {
      padding: 10px;
    }
  </style>
</head>
<body>

  <div class="demo-container">
    <h2 style="margin-bottom: 1.5rem; font-size: 1.2rem;">🔍 Prueba: Nuevo Buscador Inteligente</h2>
    <p style="margin-bottom: 2rem; color: #94a3b8; font-size: 0.9rem;">
      Haz clic en el campo e intenta escribir "Samsung", "501" o algún número de serial. 
      Nota cómo filtra instantáneamente manteniendo el diseño limpio.
    </p>

    <div class="form-group" style="display: flex; flex-direction: row; gap: 1rem; align-items: flex-end;">
      <div style="display: flex; flex-direction: column; flex: 1;">
        <label for="movTVDemo" style="margin-bottom: 0.5rem; font-weight: 500;">TV (Buscar por Código, Marca o Serial) <span style="color: #ef4444;">*</span></label>
        
        <select id="movTVDemo" placeholder="Escribe para buscar un TV..." autocomplete="off">
          <option value="">Escribe para buscar un TV...</option>
          <option value="1">[HPA-001] LG - Serial: 405RMCJ7J915</option>
          <option value="2">[HPA-002] Samsung - Serial: SMG-88123910</option>
          <option value="3">[HPA-003] Sony - Serial: SNY-551920X</option>
          <option value="4">[HPA-004] LG - Serial: 405RMCJ7J916</option>
          <option value="5">[HPA-005] TCL - Serial: TCL-991823001</option>
          <option value="6">[HPA-006] Samsung - Serial: SMG-88123911</option>
          <option value="7">[HPA-007] Toshiba - Serial: TSH-1100223</option>
          <option value="8">[HPA-008] LG - Serial: 405RMCJ7J917</option>
        </select>

      </div>
      <div style="width: 42px; height: 42px; border-radius: 4px; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; background: #0f172a; margin-bottom: 2px;">
        📺
      </div>
    </div>
    
    <div style="margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #334155;">
      <label style="display: block; margin-bottom: 0.5rem;">Origen (Se autocompleta)</label>
      <input type="text" id="demoOrigen" readonly disabled value="Esperando selección..." style="width: 100%; padding: 0.6rem; background: #0f172a; border: 1px solid #334155; color: #64748b; border-radius: 4px;" />
    </div>

  </div>

  <!-- Tom Select JS -->
  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  <script>
    // Inicializar el buscador inteligente
    new TomSelect("#movTVDemo", {
      create: false,         // No permite crear nuevas opciones
      sortField: {
        field: "text",
        direction: "asc"
      },
      placeholder: "Escribe para buscar...",
      onChange: function(value) {
        // Simulando el autocompletado del origen
        const origenInput = document.getElementById('demoOrigen');
        if(value) {
          origenInput.value = "Habitación " + (100 + parseInt(value));
          origenInput.style.color = "#f8fafc";
        } else {
          origenInput.value = "Esperando selección...";
          origenInput.style.color = "#64748b";
        }
      }
    });
  </script>
</body>
</html>
